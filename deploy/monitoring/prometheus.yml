global:
  scrape_interval: 30s
  evaluation_interval: 1m

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: stocksage
    metrics_path: /metrics
    static_configs:
      # The API on the host (uvicorn on 127.0.0.1:8000). Docker Desktop
      # forwards host.docker.internal to the host's loopback.
      - targets: ["host.docker.internal:8000"]
    # With METRICS_TOKEN set in .env, add:
    # authorization:
    #   credentials: <the same token>
